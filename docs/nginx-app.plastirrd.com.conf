# /etc/nginx/sites-available/app.plastirrd.com
# Configuración oficial para Odoo 18 en puerto 8025 con soporte WebSocket

upstream odoo_backend {
    server 127.0.0.1:8025;
}

upstream odoo_websocket {
    server 127.0.0.1:8025;
}

server {
    listen 80;
    server_name app.plastirrd.com;

    # Logs dedicados
    access_log /var/log/nginx/app.plastirrd.com.access.log;
    error_log /var/log/nginx/app.plastirrd.com.error.log;

    # Tamaño máximo de subida para archivos/imágenes en Odoo
    client_max_body_size 100M;

    # Gzip para compresión de assets
    gzip on;
    gzip_types text/css text/less text/plain text/xml application/xml application/json application/javascript;

    # Soporte nativo para WebSockets de Odoo 18 (/websocket)
    location /websocket {
        proxy_pass http://odoo_websocket;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Proxy hacia Odoo Web Client
    location / {
        proxy_pass http://odoo_backend;
        proxy_redirect off;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600;
        proxy_connect_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Cache estática para assets de Odoo
    location ~* /web/static/ {
        proxy_cache_valid 200 60m;
        proxy_buffering on;
        expires 864000;
        proxy_pass http://odoo_backend;
    }
}
