# /etc/nginx/sites-available/plastirrd.com
# Configuración oficial para Storefront PLASTIR RD (Vite / Node / PM2)

server {
    listen 80;
    server_name plastirrd.com www.plastirrd.com;

    access_log /var/log/nginx/plastirrd.com.access.log;
    error_log /var/log/nginx/plastirrd.com.error.log;

    client_max_body_size 50M;

    # Opción A: Si corre con Node / PM2 (Express / SSR) en puerto 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Opción B: Si se sirve como build estático (/var/www/plastirrd/dist)
    # root /var/www/plastirrd/dist;
    # index index.html;
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }

    # Proxy interno para sincronización con Odoo sin exponer URL al cliente
    location /api/odoo/ {
        proxy_pass http://127.0.0.1:8025/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
